<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🔤 Text Case Converter</h1>
            <p class="tool-description">Transform text strings into any case formatting convention with one click.</p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Input Text:</label>
          <textarea id="case-input" class="textarea-field" style="min-height: 160px;" placeholder="Type or paste your text here...">hello world example text for case conversion</textarea>
        </div>

        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;">
          <button class="btn btn-sm" onclick="convertCase('upper')">UPPERCASE</button>
          <button class="btn btn-sm" onclick="convertCase('lower')">lowercase</button>
          <button class="btn btn-sm" onclick="convertCase('title')">Title Case</button>
          <button class="btn btn-sm" onclick="convertCase('sentence')">Sentence case</button>
          <button class="btn btn-sm" onclick="convertCase('camel')">camelCase</button>
          <button class="btn btn-sm" onclick="convertCase('kebab')">kebab-case</button>
          <button class="btn btn-sm" onclick="convertCase('snake')">snake_case</button>
          <button class="btn btn-sm" onclick="convertCase('pascal')">PascalCase</button>
          <button class="btn btn-sm" onclick="convertCase('constant')">CONSTANT_CASE</button>
          <button class="btn btn-sm" onclick="convertCase('alternating')">aLtErNaTiNg</button>
        </div>

        <div class="form-group">
          <div class="form-label">
            <span>Converted Result:</span>
            <button class="btn btn-sm btn-primary" onclick="copyResult()">Copy Result</button>
          </div>
          <textarea id="case-output" class="textarea-field" style="min-height: 160px;" readonly></textarea>
        </div>
      </div>

      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="2000000007" data-ad-format="auto"></ins>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    const caseInput = document.getElementById('case-input');
    const caseOutput = document.getElementById('case-output');

    function getWords(str) {
      return str.trim().split(/[\s_\-]+/).filter(w => w.length > 0);
    }

    function convertCase(type) {
      const text = caseInput.value;
      let result = '';

      switch (type) {
        case 'upper':
          result = text.toUpperCase();
          break;
        case 'lower':
          result = text.toLowerCase();
          break;
        case 'title':
          result = text.toLowerCase().replace(/(?:^|\s)\w/g, match => match.toUpperCase());
          break;
        case 'sentence':
          result = text.toLowerCase().replace(/(^\w|\.\s+\w)/g, match => match.toUpperCase());
          break;
        case 'camel':
          result = getWords(text).map((w, i) => i === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('');
          break;
        case 'kebab':
          result = getWords(text).map(w => w.toLowerCase()).join('-');
          break;
        case 'snake':
          result = getWords(text).map(w => w.toLowerCase()).join('_');
          break;
        case 'pascal':
          result = getWords(text).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('');
          break;
        case 'constant':
          result = getWords(text).map(w => w.toUpperCase()).join('_');
          break;
        case 'alternating':
          result = text.split('').map((c, i) => i % 2 === 0 ? c.toLowerCase() : c.toUpperCase()).join('');
          break;
      }

      caseOutput.value = result;
    }

    function copyResult() {
      if (!caseOutput.value) return;
      copyToClipboard(caseOutput.value, 'Converted text copied!');
    }

    convertCase('title');
  </script>
</body>
</html>
