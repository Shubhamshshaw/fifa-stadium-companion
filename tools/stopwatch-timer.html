<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Precision Stopwatch & Countdown Timer with Laps | OmniUtil</title>
  <meta name="description" content="Millisecond accuracy online stopwatch with lap time recorder and customizable countdown timer with audio chime alert.">
  <meta name="keywords" content="stopwatch online, countdown timer, lap timer, millisecond stopwatch, digital timer, audio chime timer">
  <link rel="canonical" href="https://shubhamshshaw.github.io/fifa-stadium-companion/tools/stopwatch-timer.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Online Precision Stopwatch & Countdown Timer | OmniUtil">
  <meta property="og:description" content="Millisecond accuracy stopwatch with lap recorder & countdown timer chime.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/fifa-stadium-companion/tools/stopwatch-timer.html">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card" style="text-align: center;">
        <div class="tool-header" style="justify-content: center; text-align: center;">
          <div class="tool-title-group">
            <h1>⏱️ Stopwatch & Countdown Timer</h1>
            <p class="tool-description">High-precision millisecond timer with lap recorder and Web Audio API audio chime alerts.</p>
          </div>
        </div>

        <div style="font-size: 4rem; font-weight: 900; font-family: 'Fira Code', monospace; color: var(--accent-primary); margin: 1.5rem 0;" id="display-time">
          00:00:00.<span style="font-size: 2.5rem; color: var(--text-muted);" id="display-ms">00</span>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem;">
          <button id="btn-start" class="btn btn-primary btn-lg" onclick="toggleTimer()">Start</button>
          <button id="btn-lap" class="btn btn-lg" onclick="recordLap()" disabled>Lap</button>
          <button id="btn-reset" class="btn btn-lg" onclick="resetTimer()">Reset</button>
        </div>

        <!-- Laps Table -->
        <div style="max-width: 500px; margin: 0 auto; text-align: left;">
          <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">Lap Records</h3>
          <div id="laps-container" style="max-height: 200px; overflow-y: auto; background: var(--bg-secondary); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 0.5rem;">
            <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 1rem;">No laps recorded yet.</div>
          </div>
        </div>
      </div>

      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="2000000011" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;
    let running = false;
    let laps = [];

    function toggleTimer() {
      const startBtn = document.getElementById('btn-start');
      const lapBtn = document.getElementById('btn-lap');

      if (!running) {
        running = true;
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(updateDisplay, 10);
        startBtn.textContent = 'Pause';
        startBtn.style.background = 'var(--warning)';
        lapBtn.disabled = false;
      } else {
        running = false;
        clearInterval(timerInterval);
        startBtn.textContent = 'Resume';
        startBtn.style.background = 'var(--accent-gradient)';
        lapBtn.disabled = true;
      }
    }

    function updateDisplay() {
      elapsedTime = Date.now() - startTime;
      const ms = Math.floor((elapsedTime % 1000) / 10);
      const s = Math.floor((elapsedTime / 1000) % 60);
      const m = Math.floor((elapsedTime / (1000 * 60)) % 60);
      const h = Math.floor(elapsedTime / (1000 * 60 * 60));

      const timeStr = `${pad(h)}:${pad(m)}:${pad(s)}`;
      document.getElementById('display-time').firstChild.nodeValue = timeStr + '.';
      document.getElementById('display-ms').textContent = pad(ms);
    }

    function pad(n) { return n < 10 ? '0' + n : n; }

    function recordLap() {
      if (!running) return;
      laps.unshift({ num: laps.length + 1, time: elapsedTime });
      renderLaps();
    }

    function renderLaps() {
      const container = document.getElementById('laps-container');
      if (laps.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 1rem;">No laps recorded yet.</div>';
        return;
      }

      container.innerHTML = laps.map(l => {
        const ms = Math.floor((l.time % 1000) / 10);
        const s = Math.floor((l.time / 1000) % 60);
        const m = Math.floor((l.time / (1000 * 60)) % 60);
        const h = Math.floor(l.time / (1000 * 60 * 60));
        return `
          <div style="display: flex; justify-content: space-between; padding: 0.5rem 1rem; border-bottom: 1px solid var(--card-border); font-family: monospace;">
            <span>Lap ${l.num}</span>
            <span style="color: var(--accent-primary); font-weight: 700;">${pad(h)}:${pad(m)}:${pad(s)}.${pad(ms)}</span>
          </div>
        `;
      }).join('');
    }

    function resetTimer() {
      running = false;
      clearInterval(timerInterval);
      elapsedTime = 0;
      laps = [];
      document.getElementById('display-time').firstChild.nodeValue = '00:00:00.';
      document.getElementById('display-ms').textContent = '00';
      const startBtn = document.getElementById('btn-start');
      startBtn.textContent = 'Start';
      startBtn.style.background = 'var(--accent-gradient)';
      document.getElementById('btn-lap').disabled = true;
      renderLaps();
    }
  </script>
</body>
</html>
