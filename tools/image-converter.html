<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Image Format Converter (PNG, JPG, WEBP) | OmniUtil</title>
  <meta name="description" content="Convert image formats online for free. Seamlessly switch between PNG, JPG, WEBP, and BMP image files right inside your browser. No upload servers required.">
  <meta name="keywords" content="image converter, convert png to jpg, convert webp to png, convert jpg to webp, photo format converter">
  <link rel="canonical" href="https://shubhamshshaw.github.io/fifa-stadium-companion/tools/image-converter.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Online Image Format Converter (PNG, JPG, WEBP) | OmniUtil">
  <meta property="og:description" content="Convert images between PNG, JPG, WEBP, and BMP formats instantly with quality control.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/fifa-stadium-companion/tools/image-converter.html">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🖼️ Image Converter</h1>
            <p class="tool-description">Convert image formats instantly client-side without uploading files to remote servers.</p>
          </div>
        </div>

        <div id="drop-zone" class="drop-zone">
          <div class="drop-zone-icon">🌄</div>
          <h3 style="margin-bottom: 0.5rem;">Upload Image to Convert</h3>
          <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1rem;">Supports PNG, JPG, WEBP, GIF, BMP</p>
          <input type="file" id="file-input" accept="image/*" style="display: none;">
          <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">Choose File</button>
        </div>

        <div id="converter-controls" style="margin-top: 1.5rem; display: none;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
            <div class="form-group">
              <label class="form-label">Target Format:</label>
              <select id="target-format" class="select-field">
                <option value="image/png">PNG (.png)</option>
                <option value="image/jpeg">JPG / JPEG (.jpg)</option>
                <option value="image/webp">WEBP (.webp)</option>
                <option value="image/bmp">BMP (.bmp)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Output Quality: <span id="quality-val">90%</span></label>
              <input type="range" id="quality-range" min="20" max="100" value="90" class="input-field">
            </div>
          </div>

          <div style="text-align: center; margin-top: 1rem;">
            <a id="download-btn" class="btn btn-primary btn-lg">Download Converted Image</a>
          </div>

          <div style="margin-top: 1.5rem; text-align: center;">
            <img id="preview-img" style="max-width: 100%; max-height: 350px; border-radius: var(--radius-md); border: 1px solid var(--card-border);" alt="Converted Preview">
          </div>
        </div>
      </div>

      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="2000000002" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    let loadedImage = null;
    let fileName = 'image';
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const targetFormat = document.getElementById('target-format');
    const qualityRange = document.getElementById('quality-range');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });
    targetFormat.addEventListener('change', renderConversion);
    qualityRange.addEventListener('input', (e) => {
      document.getElementById('quality-val').textContent = `${e.target.value}%`;
      renderConversion();
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        showToast('Please upload a valid image', 'error');
        return;
      }
      fileName = file.name.replace(/\.[^/.]+$/, '');
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          document.getElementById('converter-controls').style.display = 'block';
          renderConversion();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderConversion() {
      if (!loadedImage) return;
      const canvas = document.createElement('canvas');
      canvas.width = loadedImage.width;
      canvas.height = loadedImage.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(loadedImage, 0, 0);

      const mime = targetFormat.value;
      const quality = parseInt(qualityRange.value) / 100;
      const dataUrl = canvas.toDataURL(mime, quality);

      document.getElementById('preview-img').src = dataUrl;
      const btn = document.getElementById('download-btn');
      btn.href = dataUrl;
      const ext = mime.split('/')[1] === 'jpeg' ? 'jpg' : mime.split('/')[1];
      btn.download = `${fileName}.${ext}`;
    }
  </script>
</body>
</html>
