<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>

  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🎂 Age Calculator</h1>
            <p class="tool-description">Real-time age calculation breakdown with second-by-second ticker & milestone stats.</p>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group">
            <label class="form-label">Date of Birth:</label>
            <input type="date" id="dob-input" value="1998-05-15" class="input-field">
          </div>
          <div class="form-group">
            <label class="form-label">Age at Date:</label>

          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card"><div id="age-years" class="stat-value">0</div><div class="stat-label">Years</div></div>
          <div class="stat-card"><div id="age-months" class="stat-value">0</div><div class="stat-label">Months</div></div>
          <div class="stat-card"><div id="age-days" class="stat-value">0</div><div class="stat-label">Days</div></div>
          <div class="stat-card"><div id="age-seconds" class="stat-value" style="font-size: 1.2rem;">0</div><div class="stat-label">Seconds</div></div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 1rem;">
          <div class="stat-card" style="text-align: left;">
            <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Total Days Lived</div>
            <div id="total-days" style="font-size: 1.25rem; font-weight: 700; color: var(--accent-primary);">0 days</div>
          </div>
          <div class="stat-card" style="text-align: left;">

          </div>

  <div id="search-modal-overlay" class="modal-overlay">

  <footer class="app-footer">

  <script src="../js/app.js"></script>
  <script>
    const dobInput = document.getElementById('dob-input');
    const targetDateInput = document.getElementById('target-date');

    // Set target date default to today
    const todayStr = new Date().toISOString().split('T')[0];
    targetDateInput.value = todayStr;

    dobInput.addEventListener('change', calculateAge);
    targetDateInput.addEventListener('change', calculateAge);

    setInterval(calculateAge, 1000);

    function calculateAge() {
      const dobVal = dobInput.value;
      if (!dobVal) return;

      const birthDate = new Date(dobVal);
      const targetDate = targetDateInput.value ? new Date(targetDateInput.value + 'T' + new Date().toTimeString().split(' ')[0]) : new Date();

      if (birthDate > targetDate) {
        document.getElementById('age-years').textContent = '0';
        document.getElementById('age-months').textContent = '0';
        document.getElementById('age-days').textContent = '0';
        document.getElementById('age-seconds').textContent = '0';
        return;
      }

      let y = targetDate.getFullYear() - birthDate.getFullYear();
      let m = targetDate.getMonth() - birthDate.getMonth();
      let d = targetDate.getDate() - birthDate.getDate();

      if (d < 0) {
        m--;
        const prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0).getDate();
        d += prevMonth;
      }
      if (m < 0) {
        y--;
        m += 12;
      }

      const diffMs = targetDate - birthDate;
      const totalSeconds = Math.floor(diffMs / 1000);
      const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      document.getElementById('age-years').textContent = y;
      document.getElementById('age-months').textContent = m;
      document.getElementById('age-days').textContent = d;
      document.getElementById('age-seconds').textContent = totalSeconds.toLocaleString();
      document.getElementById('total-days').textContent = `${totalDays.toLocaleString()} days`;

      // Zodiac Sign
      document.getElementById('zodiac-sign').textContent = getZodiacSign(birthDate.getDate(), birthDate.getMonth() + 1);

      // Next Birthday Countdown
      const nextBdayDate = new Date(targetDate.getFullYear(), birthDate.getMonth(), birthDate.getDate());
      if (nextBdayDate < targetDate) {
        nextBdayDate.setFullYear(targetDate.getFullYear() + 1);
      }
      const daysToBday = Math.ceil((nextBdayDate - targetDate) / (1000 * 60 * 60 * 24));
      document.getElementById('next-bday').textContent = `In ${daysToBday} days`;
    }

    function getZodiacSign(day, month) {
      const signs = [
        { name: 'Capricorn ♑', maxDay: 19 },
        { name: 'Aquarius ♒', maxDay: 18 },
        { name: 'Pisces ♓', maxDay: 20 },
        { name: 'Aries ♈', maxDay: 19 },
        { name: 'Taurus ♉', maxDay: 20 },
        { name: 'Gemini ♊', maxDay: 20 },
        { name: 'Cancer ♋', maxDay: 22 },
        { name: 'Leo ♌', maxDay: 22 },
        { name: 'Virgo ♍', maxDay: 22 },
        { name: 'Libra ♎', maxDay: 22 },
        { name: 'Scorpio ♏', maxDay: 21 },
        { name: 'Sagittarius ♐', maxDay: 21 },
        { name: 'Capricorn ♑', maxDay: 31 }
      ];
      return day <= signs[month - 1].maxDay ? signs[month - 1].name : signs[month].name;
    }

    calculateAge();
  </script>
</body>
