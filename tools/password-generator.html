<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Random Password Generator & Strength Checker | OmniUtil</title>
  <meta name="description" content="Generate strong, random, cryptographically secure passwords. Customize length, symbols, numbers, and check real-time entropy strength meter.">
  <meta name="keywords" content="password generator, random password, secure password maker, strong password generator, password entropy">
  <link rel="canonical" href="https://shubhamshshaw.github.io/fifa-stadium-companion/tools/password-generator.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Secure Random Password Generator & Strength Checker | OmniUtil">
  <meta property="og:description" content="Generate customizable, cryptographically secure passwords with entropy meter.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/fifa-stadium-companion/tools/password-generator.html">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🔒 Password Generator</h1>
            <p class="tool-description">Generate cryptographically secure random passwords using Web Crypto API.</p>
          </div>
        </div>

        <div class="output-box" style="margin-bottom: 1.5rem; font-size: 1.35rem; display: flex; align-items: center; justify-content: space-between;">
          <span id="pass-output" style="letter-spacing: 1px; word-break: break-all; color: var(--accent-primary);">Generating...</span>
          <button class="btn btn-sm btn-primary" onclick="copyPass()">Copy</button>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600;">
            <span>Password Strength:</span>
            <span id="strength-label" style="color: var(--success);">Strong (128 bits)</span>
          </div>
          <div style="height: 8px; background: var(--bg-secondary); border-radius: 4px; overflow: hidden;">
            <div id="strength-bar" style="height: 100%; width: 85%; background: var(--success); transition: var(--transition);"></div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
          <div>
            <div class="form-group">
              <label class="form-label">Password Length: <span id="len-val">16</span></label>
              <input type="range" id="pass-length" min="6" max="64" value="16" class="input-field">
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem;">
              <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="checkbox" id="chk-uppercase" checked> Include Uppercase (A-Z)
              </label>
              <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="checkbox" id="chk-lowercase" checked> Include Lowercase (a-z)
              </label>
              <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="checkbox" id="chk-numbers" checked> Include Numbers (0-9)
              </label>
              <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="checkbox" id="chk-symbols" checked> Include Symbols (!@#$%^&*)
              </label>
            </div>
          </div>

          <div>
            <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">Batch Passwords</h3>
            <div id="batch-container" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
          </div>
        </div>

        <div style="margin-top: 1.5rem; text-align: center;">
          <button class="btn btn-primary btn-lg" onclick="generatePasswords()">Regenerate Password</button>
        </div>
      </div>

      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="2000000005" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    const lenRange = document.getElementById('pass-length');
    const chkUpper = document.getElementById('chk-uppercase');
    const chkLower = document.getElementById('chk-lowercase');
    const chkNum = document.getElementById('chk-numbers');
    const chkSym = document.getElementById('chk-symbols');

    [lenRange, chkUpper, chkLower, chkNum, chkSym].forEach(el => el.addEventListener('input', generatePasswords));

    function getRandomChar(charset) {
      const array = new Uint32Array(1);
      window.crypto.getRandomValues(array);
      return charset[array[0] % charset.length];
    }

    function createSinglePassword(length) {
      let charset = '';
      if (chkUpper.checked) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (chkLower.checked) charset += 'abcdefghijklmnopqrstuvwxyz';
      if (chkNum.checked) charset += '0123456789';
      if (chkSym.checked) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';

      if (!charset) charset = 'abcdefghijklmnopqrstuvwxyz';

      let pass = '';
      for (let i = 0; i < length; i++) {
        pass += getRandomChar(charset);
      }
      return { pass, poolSize: charset.length };
    }

    function generatePasswords() {
      const length = parseInt(lenRange.value);
      document.getElementById('len-val').textContent = length;

      const mainObj = createSinglePassword(length);
      document.getElementById('pass-output').textContent = mainObj.pass;

      // Entropy = log2(poolSize^length)
      const entropy = Math.round(length * Math.log2(mainObj.poolSize));
      const strengthBar = document.getElementById('strength-bar');
      const strengthLabel = document.getElementById('strength-label');

      let pct = Math.min(100, Math.round((entropy / 128) * 100));
      strengthBar.style.width = `${pct}%`;

      if (entropy < 40) {
        strengthBar.style.background = 'var(--danger)';
        strengthLabel.textContent = `Weak (${entropy} bits)`;
        strengthLabel.style.color = 'var(--danger)';
      } else if (entropy < 70) {
        strengthBar.style.background = 'var(--warning)';
        strengthLabel.textContent = `Fair (${entropy} bits)`;
        strengthLabel.style.color = 'var(--warning)';
      } else {
        strengthBar.style.background = 'var(--success)';
        strengthLabel.textContent = `Ultra-Secure (${entropy} bits)`;
        strengthLabel.style.color = 'var(--success)';
      }

      // Batch passwords
      const batchContainer = document.getElementById('batch-container');
      const batchPasses = [];
      for (let i = 0; i < 4; i++) {
        batchPasses.push(createSinglePassword(length).pass);
      }
      batchContainer.innerHTML = batchPasses.map(p => `
        <div style="background: var(--bg-secondary); border: 1px solid var(--card-border); padding: 0.5rem 0.75rem; border-radius: var(--radius-sm); font-family: monospace; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center;">
          <span style="word-break: break-all;">${p}</span>
          <button class="btn btn-sm" onclick="copyToClipboard('${p}', 'Batch password copied!')">Copy</button>
        </div>
      `).join('');
    }

    function copyPass() {
      const text = document.getElementById('pass-output').textContent;
      copyToClipboard(text, 'Password copied to clipboard!');
    }

    generatePasswords();
  </script>
</body>
</html>
