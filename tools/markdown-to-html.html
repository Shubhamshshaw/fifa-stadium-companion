</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📄 Markdown to HTML Converter</h1>
            <p class="tool-description">Real-time Markdown editor with live visual preview and raw HTML generator.</p>
          </div>
          <button class="btn btn-primary" onclick="copyHTML()">Copy HTML Code</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Markdown Input:</label>
            <textarea id="md-input" class="textarea-field" style="min-height: 380px; font-family: 'Fira Code', monospace;" placeholder="Type Markdown here..."># Welcome to OmniUtil

This is a **live Markdown editor**.

## Features:
- Instant HTML rendering
- Code snippet support: `const x = 10;`
- Bullet lists & blockquotes

> Privacy-first, zero server tracking.
</textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Rendered HTML Preview:</label>
            <div id="html-preview" style="min-height: 380px; background: var(--bg-secondary); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 1rem; overflow-y: auto;"></div>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1.5rem;">
          <label class="form-label">Generated HTML Code:</label>
          <textarea id="html-code" class="textarea-field" style="min-height: 120px; font-family: 'Fira Code', monospace;" readonly></textarea>
        </div>
      </div>

      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="2000000012" data-ad-format="auto"></ins>

        </div>

  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>

  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    const mdInput = document.getElementById('md-input');
    const preview = document.getElementById('html-preview');
    const codeOutput = document.getElementById('html-code');

    mdInput.addEventListener('input', parseMarkdown);

    function parseMarkdown() {
      let text = mdInput.value;

      // Simple Markdown parser
      let html = text
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^\> (.*$)/gim, '<blockquote style="border-left: 3px solid var(--accent-primary); padding-left: 0.75rem; color: var(--text-secondary);">$1</blockquote>')
        .replace(/\*\*(.*)\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*)\*/gim, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code style="background: var(--bg-tertiary); padding: 0.2rem 0.4rem; border-radius: 4px;">$1</code>')
        .replace(/^\- (.*$)/gim, '<li>$1</li>')
        .replace(/\n\n/g, '<p></p>');

      preview.innerHTML = html;
      codeOutput.value = html;
    }

    function copyHTML() {
      if (!codeOutput.value) return;
      copyToClipboard(codeOutput.value, 'HTML code copied to clipboard!');
    }

    parseMarkdown();
  </script>
</body>
</html>
